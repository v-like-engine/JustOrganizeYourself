[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "joy-embeddings"
version = "0.1.0"
description = "Optional local semantic embeddings and knowledge graph service for JOY"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
model = ["fastembed>=0.6,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
joy-embeddings = "joy_embeddings.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
